[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workshop-video-brain"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "faster-whisper>=1.2.1",
    "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
research = ["numpy>=1.26", "Pillow>=10.0", "pytesseract>=0.3"]
# Local AI mask generation (producing matte videos for Shape Alpha / mask_set).
# Default engine is the LIGHTEST viable one: rembg on onnxruntime -- CPU-friendly,
# NO torch (~20 MB runtime + a 4-176 MB model auto-downloaded on first use).
# Install: `uv pip install -e '.[ai-mask]'` (or `uv pip install rembg onnxruntime`).
ai-mask = [
    "rembg>=2.0",
    "onnxruntime>=1.16",
]
# Second tier (best quality + temporal propagation, NOT installed by default):
# SAM2 / YOLO-seg pull the multi-GB torch stack and want a GPU. Documented, not
# wired up here -- `mask_generate(engine="sam2")` returns an actionable install
# hint. To enable: `uv pip install ultralytics`.
ai-mask-heavy = [
    "ultralytics>=8.3",
]
# Motion tracking / AI subject-focus FALLBACK engine (plan §5). The PRIMARY
# tracker is the MLT `opencv.tracker` filter run headless via the `melt` binary
# (no Python deps -- the §5 feasibility spike confirmed melt persists analysis
# `results`). This group installs the pure-Python fallback used when melt is
# unavailable or `engine="opencv"` is requested: contrib OpenCV (CSRT/KCF/MOSSE
# trackers, ~66 MB, headless -- no GUI/torch). `subject_track(engine="opencv")`
# returns an actionable install hint when missing.
# Install: `uv pip install -e '.[motion-track]'`.
motion-track = [
    "opencv-contrib-python-headless>=4.8",
]
# Optional second scene-detection engine (PySceneDetect); ffmpeg stays the default.
# 0.6.x, not 0.7: 0.7 requires the GUI opencv-python (libGL) and dropped this extra.
# Installs opencv-python-headless beside motion-track's contrib build. Both own
# cv2/; the pair was checked at opencv 5.0.0.93 and imports fine with trackers
# present, but the wheels do overwrite each other's files if their versions differ.
# Install: `uv pip install -e '.[scene-detect]'`.
scene-detect = [
    "scenedetect[opencv-headless]>=0.6.7,<0.7",
]
# Optional silence-cut engine; ffmpeg is the no-dependency fallback. A thin launcher
# that downloads its native binary from GitHub on first run (x86_64 only on Linux).
# Install: `uv pip install -e '.[auto-editor]'`, then run `auto-editor --version` once.
auto-editor = [
    "auto-editor>=29",
]

[project.scripts]
workshop-video-brain-server = "workshop_video_brain.server:main"
wvb = "workshop_video_brain.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop_video_brain"]

# See the identical block in the repository-root pyproject.toml: all three
# template trees live outside the package directory, so without this a wheel
# built here ships none of them. Both build roots must carry every mapping,
# because either one can produce the wheel a user installs.
[tool.hatch.build.targets.wheel.force-include]
"../templates/obsidian" = "workshop_video_brain/templates/obsidian"
"../templates/render" = "workshop_video_brain/templates/render"
"../templates/titles" = "workshop_video_brain/templates/titles"
